name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'web/**', 'tools/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'web/**', 'tools/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # publishes the rolling "latest" release on main

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      # Optional: set these repository secrets to sign the release APK with your own key.
      RETRO_KEYSTORE_B64: ${{ secrets.RETRO_KEYSTORE_B64 }}
      RETRO_KEYSTORE_PASSWORD: ${{ secrets.RETRO_KEYSTORE_PASSWORD }}
      RETRO_KEY_ALIAS: ${{ secrets.RETRO_KEY_ALIAS }}
      RETRO_KEY_PASSWORD: ${{ secrets.RETRO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key (optional)
        run: |
          if [ -n "$RETRO_KEYSTORE_B64" ]; then
            echo "$RETRO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/retro.keystore"
            echo "RETRO_KEYSTORE=$RUNNER_TEMP/retro.keystore" >> "$GITHUB_ENV"
          fi

      - name: Unit tests (installer security, console + page renders)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build APKs
        # Pull-request builds read the Game Store from the PR's own branch so the store works before merging;
        # builds from main use the default (main). Branch names go through env vars, never inline in the script.
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          THIS_REPO: ${{ github.repository }}
        run: |
          EXTRA=""
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            EXTRA="-PstoreUrl=https://raw.githubusercontent.com/$THIS_REPO/$HEAD_REF/store/catalog.json"
          fi
          ./gradlew assembleDebug assembleRelease --console=plain $EXTRA

      - name: Collect APKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/RetroConsole.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/RetroConsole-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RetroConsole-apk
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-screenshots
          path: android/app/build/screenshots/*.png
          if-no-files-found: ignore

      - name: Move the "latest" tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Retro Console - latest build
          body: |
            Latest build of the Retro Console Android app (commit ${{ github.sha }}).
            Download **RetroConsole.apk**, open it on your phone and allow "Install unknown apps" when asked.
          files: dist/*.apk
          prerelease: false
